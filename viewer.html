<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Viewer — Heroes</title>
    <style>
      :root { --bg: #0b1026; --panel: rgba(12, 16, 36, 0.86); --line: rgba(255, 255, 255, 0.14); --text: #f3f1ea; --muted: #a9adbf; --accent: #ffb04a; }
      * { box-sizing: border-box; margin: 0; padding: 0 }
      html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
      canvas { display: block }
      #panel { position: fixed; left: 16px; top: 16px; width: 260px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; backdrop-filter: blur(6px) }
      h1 { font-size: 17px; font-weight: 700 }
      p { color: var(--muted); font-size: 12.5px; margin: 4px 0 12px }
      .label { color: var(--muted); font-size: 11.5px; margin: 12px 0 6px }
      .row { display: flex; flex-wrap: wrap; gap: 6px }
      button { cursor: pointer; font: inherit; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px }
      button:hover { background: rgba(255, 255, 255, 0.13) }
      button.on { background: var(--accent); border-color: var(--accent); color: #1c1206; font-weight: 600 }
      #stats { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 12px }
      #captions { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 0; pointer-events: none }
      #captions span { width: 50%; text-align: center; color: var(--muted); font-size: 12.5px }
      #captions.single span:first-child { display: none }
      #captions.single span { width: 100% }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1>Ember Warden</h1>
      <p>Skinned and animated .glb heroes, generated by <code>npm run build:heroes</code>. Drag to orbit, scroll to zoom.</p>
      <div class="label">Hero</div>
      <div class="row" id="heroes"></div>
      <div class="label">Animation</div>
      <div class="row" id="clips"></div>
      <div class="label">Team</div>
      <div class="row"><button data-team="blue" class="on">Blue</button><button data-team="red">Red</button></div>
      <div class="label">View</div>
      <div class="row">
        <button id="compare">Compare with old Ember Warden</button>
        <button id="arenaCam">Arena camera</button>
        <button id="turntable" class="on">Turntable</button>
        <button id="wire">Wireframe</button>
        <button id="bones">Skeleton</button>
      </div>
      <div id="stats"></div>
    </div>
    <div id="captions" class="single"><span>Old: procedural primitives</span><span>New: skinned .glb</span></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
