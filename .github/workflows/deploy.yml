# Builds the game and publishes it to GitHub Pages on every push to main.
# Live at https://rdong25.github.io/cr-3d/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Bake the commit into the bundle and publish it as version.json, so
      # installed copies can tell they're out of date (src/updater.ts).
      - run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
      - run: echo "{\"id\":\"${{ github.sha }}\"}" > dist/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
